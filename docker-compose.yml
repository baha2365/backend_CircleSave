services:
  frontend:
    build: ./frontend
    depends_on:
      - backend

  backend:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:123@postgres:5432/CircleSave
      REDIS_URL: redis://redis:6379

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: CircleSave

  redis:
    image: redis:7