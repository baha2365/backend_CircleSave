<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html">Circle<span>Save</span></a></div>
    <div class="auth-sub">Reset your password</div>

    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:48px;margin-bottom:12px">🔑</div>
      <div style="font-size:14px;color:var(--text3)">Enter your email address and we'll send you a reset code.</div>
    </div>

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input type="email" class="form-input" id="forgot-email" placeholder="you@example.com" autocomplete="email">
    </div>

    <button class="btn btn-primary btn-block btn-lg" onclick="handleForgot()">Send reset code</button>

    <div style="text-align:center;margin-top:16px">
      <a href="login.html" style="color:var(--accent);font-size:13px;font-weight:500">← Back to sign in</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script>
  async function handleForgot() {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) { toast('Please enter your email', 'error'); return; }
    await api.req('POST', '/auth/forgot-password', { email }, false);
    toast("If that email exists, a reset code was sent.", 'info');
    sessionStorage.setItem('reset_email', email);
    setTimeout(() => window.location.href = 'reset-password.html', 1000);
  }
</script>
</body>
</html>
