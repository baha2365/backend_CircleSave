<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-layout">
  <div id="main">
    <div id="page" class="page-fade">

      <div class="section-header">
        <h2 class="section-title">Payment History</h2>
        <button class="btn btn-primary btn-sm" onclick="openPaymentModal()">+ Submit Payment</button>
      </div>

      <!-- Filters -->
      <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
        <select class="form-select" id="filter-status" style="width:auto;min-width:150px" onchange="applyFilter()">
          <option value="">All statuses</option>
          <option value="COMPLETED">Completed</option>
          <option value="PENDING">Pending</option>
          <option value="PARTIAL">Partial</option>
          <option value="FAILED">Failed</option>
          <option value="REFUNDED">Refunded</option>
        </select>
        <select class="form-select" id="filter-circle" style="width:auto;min-width:180px" onchange="applyFilter()">
          <option value="">All circles</option>
        </select>
        <div id="filter-summary" style="margin-left:auto;font-size:13px;color:var(--text3)"></div>
      </div>

      <!-- Payment list -->
      <div id="payments-list" class="payments-list">
        <div style="text-align:center;padding:40px"><div class="spinner spinner-dark" style="display:inline-block"></div></div>
      </div>

      <!-- Summary card -->
      <div id="payments-summary" style="margin-top:24px;display:none">
        <div class="card">
          <div class="card-title" style="margin-bottom:16px">Summary</div>
          <div id="summary-content"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script src="js/app-shell.js"></script>
<script>
// ── Boot ───────────────────────────────────────────────
const pageUser = initShell({
  title:      'Payments',
  actionHtml: `<button class="btn btn-primary btn-sm" onclick="openPaymentModal()">+ Submit Payment</button>`
});
if (pageUser) loadPayments();

// ── State ──────────────────────────────────────────────
let allPayments = [];
let allCircles  = [];

// ── Load ───────────────────────────────────────────────
async function loadPayments() {
  // Load circles for the filter dropdown and payment modal
  const cRes = await api.get('/circles');
  allCircles  = (cRes && cRes.ok && cRes.data.data) ? cRes.data.data : DEMO.circles;
  populatePaymentCircles(allCircles);
  populateCircleFilter(allCircles);

  // Load payments
  const pRes = await api.get('/users/me/payments');
  allPayments = (pRes && pRes.ok && pRes.data.data) ? pRes.data.data : DEMO.payments;
  renderPayments(allPayments);
}

function populateCircleFilter(circles) {
  const sel = document.getElementById('filter-circle');
  circles.forEach(c => {
    const opt = document.createElement('option');
    opt.value       = c.id;
    opt.textContent = c.name;
    sel.appendChild(opt);
  });
}

// ── Render ─────────────────────────────────────────────
function renderPayments(payments) {
  const el = document.getElementById('payments-list');

  if (!payments.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💳</div>
        <div class="empty-title">No payments found</div>
        <div class="empty-desc">Your contribution history will appear here once you submit payments.</div>
        <button class="btn btn-primary" onclick="openPaymentModal()">Submit First Payment</button>
      </div>`;
    document.getElementById('payments-summary').style.display = 'none';
    return;
  }

  el.innerHTML = payments.map(p => paymentRow(p)).join('');

  // Summary
  const completed = payments.filter(p => p.status === 'COMPLETED');
  const pending   = payments.filter(p => p.status === 'PENDING');
  const partial   = payments.filter(p => p.status === 'PARTIAL');
  const totalPaid = completed.reduce((s, p) => s + (p.amount || 0), 0);

  document.getElementById('filter-summary').textContent =
    `${payments.length} payment${payments.length !== 1 ? 's' : ''}`;

  document.getElementById('summary-content').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px">
      <div style="text-align:center;padding:16px;background:var(--green-l);border-radius:var(--r12)">
        <div style="font-size:12px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Total Paid</div>
        <div style="font-family:var(--ff-d);font-size:24px;font-weight:700;color:var(--green)">$${totalPaid.toLocaleString()}</div>
        <div style="font-size:12px;color:var(--green);margin-top:2px">${completed.length} payments</div>
      </div>
      <div style="text-align:center;padding:16px;background:var(--amber-l);border-radius:var(--r12)">
        <div style="font-size:12px;color:var(--amber);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Pending</div>
        <div style="font-family:var(--ff-d);font-size:24px;font-weight:700;color:var(--amber)">${pending.length}</div>
        <div style="font-size:12px;color:var(--amber);margin-top:2px">awaiting confirmation</div>
      </div>
      <div style="text-align:center;padding:16px;background:var(--blue-l);border-radius:var(--r12)">
        <div style="font-size:12px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Partial</div>
        <div style="font-family:var(--ff-d);font-size:24px;font-weight:700;color:var(--blue)">${partial.length}</div>
        <div style="font-size:12px;color:var(--blue);margin-top:2px">partially paid</div>
      </div>
    </div>`;
  document.getElementById('payments-summary').style.display = 'block';
}

// ── Filter ─────────────────────────────────────────────
function applyFilter() {
  const status   = document.getElementById('filter-status').value;
  const circleId = document.getElementById('filter-circle').value;
  let filtered   = allPayments;
  if (status)   filtered = filtered.filter(p => p.status   === status);
  if (circleId) filtered = filtered.filter(p => p.circleId === circleId);
  renderPayments(filtered);
}

// ── Open payment modal with circles pre-filled ─────────
function openPaymentModal() {
  populatePaymentCircles(allCircles);
  showModal('modal-payment');
}
</script>
</body>
</html>
