<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--r12);padding:4px;margin-bottom:28px;overflow-x:auto}
  .admin-tab{padding:9px 20px;border-radius:var(--r8);font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s;border:none;background:none}
  .admin-tab.active{background:var(--surface);color:var(--accent);box-shadow:var(--sh1)}
  .admin-tab-content{display:none}
  .admin-tab-content.active{display:block}
  .user-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .user-row:last-child{border-bottom:none}
  .user-row:hover{background:var(--bg2)}
  .circle-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
  .circle-row:last-child{border-bottom:none}
  .circle-row:hover{background:var(--bg2)}
  .audit-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px}
  .audit-row:last-child{border-bottom:none}
  .search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search-bar .form-input{max-width:280px}
  .search-bar .form-select{width:auto;min-width:120px}
  .error-banner{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--red-l);border:1px solid #f5c2c2;border-radius:var(--r12);color:var(--red);font-size:14px;font-weight:500;margin-bottom:16px}
  .action-menu{position:relative;display:inline-block}
  .action-menu-btn{padding:6px 12px;border-radius:var(--r8);background:var(--bg2);border:1px solid var(--border);font-size:12px;cursor:pointer}
  .action-menu-btn:hover{background:var(--bg3)}
  .action-dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);padding:6px;min-width:160px;box-shadow:var(--sh3);z-index:99;display:none}
  .action-dropdown.open{display:block}
  .action-dropdown button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:var(--r8);font-size:13px;border:none;background:none;cursor:pointer;color:var(--text2)}
  .action-dropdown button:hover{background:var(--bg2);color:var(--text)}
  .action-dropdown button.danger{color:var(--red)}
  .action-dropdown button.danger:hover{background:var(--red-l)}
</style>
</head>
<body>

<div id="app-layout">
  <div id="main">
    <div id="page" class="page-fade">

      <div style="margin-bottom:28px">
        <h2 class="section-title">Admin Dashboard</h2>
        <p style="color:var(--text3);font-size:14px">Platform-wide statistics and management tools</p>
      </div>

      <!-- Stats -->
      <div class="admin-grid" id="admin-stats">
        ${[1,2,3,4,5,6,7].map(()=>`<div class="stat-card"><div class="skeleton" style="height:60px"></div></div>`).join('')}
      </div>

      <!-- Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="users"      onclick="switchAdminTab('users',this)">Users</button>
        <button class="admin-tab"        data-tab="circles"    onclick="switchAdminTab('circles',this)">Circles</button>
        <button class="admin-tab"        data-tab="audit-logs" onclick="switchAdminTab('audit-logs',this)">Audit Logs</button>
      </div>

      <div id="admin-tab-users"      class="admin-tab-content active"></div>
      <div id="admin-tab-circles"    class="admin-tab-content"></div>
      <div id="admin-tab-audit-logs" class="admin-tab-content"></div>

    </div>
  </div>
</div>

<!-- BAN USER MODAL -->
<div class="modal-overlay" id="modal-ban">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red)">Ban User</div>
      <button class="modal-close" onclick="closeModal('modal-ban')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div style="margin-bottom:16px;font-size:14px;color:var(--text2)">
      Banning <strong id="ban-username"></strong> will prevent them from accessing the platform.
    </div>
    <div class="form-group">
      <label class="form-label">Reason</label>
      <textarea class="form-input" id="ban-reason" rows="3" placeholder="Repeated payment defaults and fraudulent activity"></textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('modal-ban')">Cancel</button>
      <button class="btn btn-danger"    style="flex:1" id="ban-submit-btn" onclick="handleBanUser()">Ban User</button>
    </div>
  </div>
</div>

<!-- CHANGE ROLE MODAL -->
<div class="modal-overlay" id="modal-role">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Change Role</div>
      <button class="modal-close" onclick="closeModal('modal-role')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div style="margin-bottom:16px;font-size:14px;color:var(--text2)">
      Changing role for <strong id="role-username"></strong>
    </div>
    <div class="form-group">
      <label class="form-label">New role</label>
      <select class="form-select" id="role-select">
        <option value="MEMBER">MEMBER</option>
        <option value="ORGANIZER">ORGANIZER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('modal-role')">Cancel</button>
      <button class="btn btn-primary"   style="flex:1" id="role-submit-btn" onclick="handleChangeRole()">Save Role</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script src="js/app-shell.js"></script>
<script>
let targetUserId   = null;
let targetUsername = null;
let usersNextCursor  = null;
let circlesNextCursor = null;
let auditNextCursor   = null;

(async function boot() {
  const user = initShell({ title: 'Admin' });
  if (!user) return;

  // Role guard
  if (user.role !== 'ADMIN') {
    document.getElementById('page').innerHTML = `
      <div style="text-align:center;padding:80px 20px">
        <div style="font-size:48px;margin-bottom:16px">🚫</div>
        <div style="font-family:var(--ff-d);font-size:24px;font-weight:700;margin-bottom:8px">Access Denied</div>
        <div style="color:var(--text3);font-size:15px;margin-bottom:24px">This page requires ADMIN role.</div>
        <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
      </div>`;
    return;
  }

  await loadDashboardStats();
  loadUsers();
})();

// ── Dashboard stats ───────────────────────────────────────
async function loadDashboardStats() {
  const res = await api.get('/admin/dashboard');
  if (!res || !res.ok) {
    document.getElementById('admin-stats').innerHTML = `
      <div style="grid-column:1/-1">
        <div class="error-banner">
          ${res?.data?.error?.message || 'Failed to load dashboard stats.'}
        </div>
      </div>`;
    return;
  }

  const s = res.data.data;
  document.getElementById('admin-stats').innerHTML = [
    ['Total Users',       s.totalUsers,                       '👥', '#1E6090'],
    ['Total Circles',     s.totalCircles,                     '⭕', '#C4522A'],
    ['Active Circles',    s.activeCircles,                    '✅', '#2A6040'],
    ['Completed',         s.completedCircles,                 '🎉', '#2A6040'],
    ['Total Payments',    s.totalPayments?.toLocaleString(),  '💳', '#C87D10'],
    ['Total Revenue',     '$'+(s.totalRevenue||0).toLocaleString(), '💰', '#2A6040'],
    ['Banned Users',      s.bannedUsers,                      '🚫', '#C42828'],
  ].map(([label, val, icon, color]) => `
    <div class="stat-card">
      <div style="font-size:28px;margin-bottom:8px">${icon}</div>
      <div class="stat-label">${label}</div>
      <div class="stat-val" style="color:${color}">${val ?? '—'}</div>
    </div>`).join('');
}

// ── Tab switching ─────────────────────────────────────────
function switchAdminTab(tab, btn) {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById(`admin-tab-${tab}`).classList.add('active');

  if (tab === 'users'      && !document.getElementById('admin-tab-users').dataset.loaded) loadUsers();
  if (tab === 'circles'    && !document.getElementById('admin-tab-circles').dataset.loaded) loadAdminCircles();
  if (tab === 'audit-logs' && !document.getElementById('admin-tab-audit-logs').dataset.loaded) loadAuditLogs();
}

// ── USERS ─────────────────────────────────────────────────
let usersSearchTimeout = null;

async function loadUsers(append = false, search = '', role = '') {
  const container = document.getElementById('admin-tab-users');
  container.dataset.loaded = '1';

  if (!append) {
    container.innerHTML = `
      <div class="search-bar">
        <input type="text" class="form-input" placeholder="Search username or email…" id="user-search"
          oninput="debouncedSearch()">
        <select class="form-select" id="user-role-filter" onchange="loadUsers(false,document.getElementById('user-search').value,this.value)">
          <option value="">All roles</option>
          <option value="MEMBER">MEMBER</option>
          <option value="ORGANIZER">ORGANIZER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadUsers()">Refresh</button>
      </div>
      <div id="users-table" class="card" style="padding:0;overflow:hidden">
        <div style="text-align:center;padding:40px"><div class="spinner spinner-dark" style="display:inline-block"></div></div>
      </div>
      <div id="users-more" style="text-align:center;padding:16px;display:none">
        <button class="btn btn-secondary btn-sm" onclick="loadUsersMore()">Load more</button>
      </div>`;
  }

  let url = '/admin/users?limit=20';
  if (search) url += `&search=${encodeURIComponent(search)}`;
  if (role)   url += `&role=${role}`;
  if (append && usersNextCursor) url += `&cursor=${usersNextCursor}`;

  const res = await api.get(url);
  const table = document.getElementById('users-table');
  if (!table) return;

  if (!res || !res.ok) {
    table.innerHTML = `<div class="error-banner" style="margin:16px">${res?.data?.error?.message || 'Failed to load users.'}</div>`;
    return;
  }

  const users = res.data.data || [];
  const meta  = res.data.meta?.pagination;
  usersNextCursor = meta?.nextCursor || null;
  const moreBtn = document.getElementById('users-more');
  if (moreBtn) moreBtn.style.display = meta?.hasMore ? 'block' : 'none';

  if (!users.length && !append) {
    table.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">No users found.</div>`;
    return;
  }

  const rows = users.map(u => `
    <div class="user-row">
      <div class="member-ava" style="background:${u.role==='ADMIN'?'var(--red-l)':u.role==='ORGANIZER'?'var(--accent-l)':'var(--blue-l)'};color:${u.role==='ADMIN'?'var(--red)':u.role==='ORGANIZER'?'var(--accent)':'var(--blue)'}">
        ${(u.username||'?').slice(0,2).toUpperCase()}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${u.username}</div>
        <div style="font-size:12px;color:var(--text3)">${u.email} · Trust: ${u.trustScore}</div>
        <div style="font-size:11px;color:var(--text3)">Joined ${fmtDate(u.createdAt)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="badge badge-${roleBadge(u.role)}" style="font-size:11px">${u.role}</div>
        ${u.banned ? '<div class="badge badge-red" style="font-size:11px">BANNED</div>' : ''}
        <div class="action-menu" id="menu-${u.id}">
          <button class="action-menu-btn" onclick="toggleMenu('${u.id}')">Actions ▾</button>
          <div class="action-dropdown" id="dropdown-${u.id}">
            <button onclick="openRoleModal('${u.id}','${u.username}','${u.role}')">Change Role</button>
            ${u.banned
              ? `<button onclick="handleUnban('${u.id}','${u.username}')">Unban User</button>`
              : `<button class="danger" onclick="openBanModal('${u.id}','${u.username}')">Ban User</button>`}
          </div>
        </div>
      </div>
    </div>`).join('');

  if (append) {
    table.insertAdjacentHTML('beforeend', rows);
  } else {
    table.innerHTML = rows;
  }
}

function debouncedSearch() {
  clearTimeout(usersSearchTimeout);
  usersSearchTimeout = setTimeout(() => {
    const search = document.getElementById('user-search')?.value || '';
    const role   = document.getElementById('user-role-filter')?.value || '';
    loadUsers(false, search, role);
  }, 350);
}

function loadUsersMore() {
  const search = document.getElementById('user-search')?.value || '';
  const role   = document.getElementById('user-role-filter')?.value || '';
  loadUsers(true, search, role);
}

// ── CIRCLES ───────────────────────────────────────────────
async function loadAdminCircles(append = false, status = '') {
  const container = document.getElementById('admin-tab-circles');
  container.dataset.loaded = '1';

  if (!append) {
    container.innerHTML = `
      <div class="search-bar">
        <select class="form-select" id="circle-status-filter" onchange="loadAdminCircles(false,this.value)">
          <option value="">All statuses</option>
          <option value="PENDING">PENDING</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="COMPLETED">COMPLETED</option>
          <option value="DISSOLVED">DISSOLVED</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadAdminCircles()">Refresh</button>
      </div>
      <div id="circles-table" class="card" style="padding:0;overflow:hidden">
        <div style="text-align:center;padding:40px"><div class="spinner spinner-dark" style="display:inline-block"></div></div>
      </div>
      <div id="circles-more" style="text-align:center;padding:16px;display:none">
        <button class="btn btn-secondary btn-sm" onclick="loadAdminCirclesMore()">Load more</button>
      </div>`;
  }

  let url = '/admin/circles?limit=20';
  if (status) url += `&status=${status}`;
  if (append && circlesNextCursor) url += `&cursor=${circlesNextCursor}`;

  const res = await api.get(url);
  const table = document.getElementById('circles-table');
  if (!table) return;

  if (!res || !res.ok) {
    table.innerHTML = `<div class="error-banner" style="margin:16px">${res?.data?.error?.message || 'Failed to load circles.'}</div>`;
    return;
  }

  const circles = res.data.data || [];
  const meta    = res.data.meta?.pagination;
  circlesNextCursor = meta?.nextCursor || null;
  const moreBtn = document.getElementById('circles-more');
  if (moreBtn) moreBtn.style.display = meta?.hasMore ? 'block' : 'none';

  if (!circles.length && !append) {
    table.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">No circles found.</div>`;
    return;
  }

  const rows = circles.map(c => `
    <div class="circle-row" onclick="window.location.href='circle-detail.html?id=${c.id}'">
      <div style="width:10px;height:10px;border-radius:50%;background:${statusColor(c.status)};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${c.name}</div>
        <div style="font-size:12px;color:var(--text3)">
          ${c.contributionAmount?.toLocaleString()} ${c.currency} · ${c.currentMembers}/${c.maxMembers} members
          ${c.currentRound ? ` · Round ${c.currentRound}/${c.totalRounds}` : ''}
        </div>
      </div>
      <div class="badge badge-${statusBadge(c.status)}">${c.status}</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`).join('');

  if (append) {
    table.insertAdjacentHTML('beforeend', rows);
  } else {
    table.innerHTML = rows;
  }
}

function loadAdminCirclesMore() {
  const status = document.getElementById('circle-status-filter')?.value || '';
  loadAdminCircles(true, status);
}

// ── AUDIT LOGS ────────────────────────────────────────────
async function loadAuditLogs(append = false) {
  const container = document.getElementById('admin-tab-audit-logs');
  container.dataset.loaded = '1';

  if (!append) {
    container.innerHTML = `
      <div class="search-bar">
        <input type="text" class="form-input" id="audit-action" placeholder="Filter by action…">
        <input type="text" class="form-input" id="audit-entity" placeholder="Filter by entity…">
        <button class="btn btn-secondary btn-sm" onclick="applyAuditFilter()">Filter</button>
        <button class="btn btn-ghost btn-sm"      onclick="clearAuditFilter()">Clear</button>
      </div>
      <div id="audit-table" class="card" style="padding:0;overflow:hidden">
        <div style="text-align:center;padding:40px"><div class="spinner spinner-dark" style="display:inline-block"></div></div>
      </div>
      <div id="audit-more" style="text-align:center;padding:16px;display:none">
        <button class="btn btn-secondary btn-sm" onclick="loadAuditMore()">Load more</button>
      </div>`;
  }

  const action = document.getElementById('audit-action')?.value.trim() || '';
  const entity = document.getElementById('audit-entity')?.value.trim() || '';
  let url = '/admin/audit-logs?limit=30';
  if (action) url += `&action=${encodeURIComponent(action)}`;
  if (entity) url += `&entity=${encodeURIComponent(entity)}`;
  if (append && auditNextCursor) url += `&cursor=${auditNextCursor}`;

  const res = await api.get(url);
  const table = document.getElementById('audit-table');
  if (!table) return;

  if (!res || !res.ok) {
    table.innerHTML = `<div class="error-banner" style="margin:16px">${res?.data?.error?.message || 'Failed to load audit logs.'}</div>`;
    return;
  }

  const logs = res.data.data || [];
  const meta = res.data.meta?.pagination;
  auditNextCursor = meta?.nextCursor || null;
  const moreBtn = document.getElementById('audit-more');
  if (moreBtn) moreBtn.style.display = meta?.hasMore ? 'block' : 'none';

  if (!logs.length && !append) {
    table.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">No audit logs found.</div>`;
    return;
  }

  const rows = logs.map(log => `
    <div class="audit-row">
      <div style="font-family:monospace;font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;padding-top:2px">${fmtDate(log.createdAt)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:var(--text)">${log.action || '—'}</div>
        <div style="color:var(--text3)">Entity: ${log.entity || '—'} ${log.entityId ? `· ID: <span style="font-family:monospace;font-size:11px">${log.entityId}</span>` : ''}</div>
        ${log.userId ? `<div style="font-size:11px;color:var(--text3)">By user: ${log.userId}</div>` : ''}
      </div>
      ${log.changes ? `<div style="font-size:11px;color:var(--text3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${JSON.stringify(log.changes)}</div>` : ''}
    </div>`).join('');

  if (append) {
    table.insertAdjacentHTML('beforeend', rows);
  } else {
    table.innerHTML = rows;
  }
}

function applyAuditFilter() { auditNextCursor = null; loadAuditLogs(); }
function clearAuditFilter() {
  document.getElementById('audit-action').value = '';
  document.getElementById('audit-entity').value = '';
  auditNextCursor = null;
  loadAuditLogs();
}
function loadAuditMore() { loadAuditLogs(true); }

// ── Action menus ──────────────────────────────────────────
function toggleMenu(userId) {
  const dropdown = document.getElementById(`dropdown-${userId}`);
  document.querySelectorAll('.action-dropdown.open').forEach(d => { if (d !== dropdown) d.classList.remove('open'); });
  dropdown.classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.action-menu')) {
    document.querySelectorAll('.action-dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

// ── Ban ───────────────────────────────────────────────────
function openBanModal(userId, username) {
  targetUserId   = userId;
  targetUsername = username;
  document.getElementById('ban-username').textContent = username;
  document.getElementById('ban-reason').value = '';
  showModal('modal-ban');
}
async function handleBanUser() {
  const reason = document.getElementById('ban-reason').value.trim();
  if (!reason) { toast('Please provide a reason', 'error'); return; }
  const btn = document.getElementById('ban-submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const res = await api.patch(`/admin/users/${targetUserId}/ban`, { reason });
  btn.disabled = false; btn.innerHTML = 'Ban User';
  if (!res || !res.ok) { toast(res?.data?.error?.message || 'Failed to ban user', 'error'); return; }
  toast(`${targetUsername} has been banned.`, 'success');
  closeModal('modal-ban');
  loadUsers();
}

async function handleUnban(userId, username) {
  if (!confirm(`Unban ${username}?`)) return;
  const res = await api.patch(`/admin/users/${userId}/unban`);
  if (!res || !res.ok) { toast(res?.data?.error?.message || 'Failed to unban', 'error'); return; }
  toast(`${username} has been unbanned.`, 'success');
  loadUsers();
}

// ── Role ──────────────────────────────────────────────────
function openRoleModal(userId, username, currentRole) {
  targetUserId   = userId;
  targetUsername = username;
  document.getElementById('role-username').textContent = username;
  document.getElementById('role-select').value = currentRole;
  showModal('modal-role');
}
async function handleChangeRole() {
  const role = document.getElementById('role-select').value;
  const btn  = document.getElementById('role-submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const res  = await api.patch(`/admin/users/${targetUserId}/role`, { role });
  btn.disabled = false; btn.innerHTML = 'Save Role';
  if (!res || !res.ok) { toast(res?.data?.error?.message || 'Failed to change role', 'error'); return; }
  toast(`${targetUsername}'s role changed to ${role}.`, 'success');
  closeModal('modal-role');
  loadUsers();
}

// Init modal overlays
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});
</script>
