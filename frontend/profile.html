<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
  @media(max-width:700px){.profile-grid{grid-template-columns:1fr}}
  .info-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
  .info-row:last-child{border-bottom:none}
  .info-row-label{color:var(--text3);width:140px;flex-shrink:0;font-size:13px}
  .info-row-val{color:var(--text);font-weight:500;flex:1;word-break:break-all}
  .trust-tier-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
  .tier-chip{flex:1;min-width:56px;text-align:center;padding:8px 6px;border-radius:var(--r8);border:1px solid var(--border);background:var(--bg2)}
  .tier-chip.active{border-color:var(--accent);background:var(--accent-l)}
  .tier-chip-label{font-size:10px;font-weight:700;color:var(--text2)}
  .tier-chip.active .tier-chip-label{color:var(--accent)}
  .tier-chip-range{font-size:9px;color:var(--text3)}
  .history-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .history-item:last-child{border-bottom:none}
  .delta-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .error-banner{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--red-l);border:1px solid #f5c2c2;border-radius:var(--r12);color:var(--red);font-size:14px;font-weight:500;margin-bottom:20px}
  .section-divider{height:1px;background:var(--border);margin:28px 0}
</style>
</head>
<body>

<div id="app-layout">
  <div id="main">
    <div id="page" class="page-fade">

      <!-- Profile header skeleton -->
      <div id="profile-header-wrap">
        <div style="text-align:center;padding:60px">
          <div class="spinner spinner-dark" style="display:inline-block"></div>
        </div>
      </div>

      <!-- Content (hidden until loaded) -->
      <div id="profile-content" style="display:none">

        <div class="profile-grid">

          <!-- Trust score card -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">Trust Score</div>
              <div id="trust-tier-badge" class="badge"></div>
            </div>
            <div id="trust-score-section"></div>
          </div>

          <!-- Account info card -->
          <div class="card">
            <div class="card-header"><div class="card-title">Account Info</div></div>
            <div id="account-info-section"></div>
          </div>

        </div>

        <!-- Edit profile card -->
        <div class="card" style="margin-bottom:24px">
          <div class="card-header"><div class="card-title">Edit Profile</div></div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" class="form-input" id="edit-username" placeholder="alice_saves">
            </div>
            <div class="form-group">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-input" id="edit-phone" placeholder="+77001234567">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Avatar URL</label>
            <input type="url" class="form-input" id="edit-avatar" placeholder="https://…">
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn btn-primary" id="save-profile-btn" onclick="handleUpdateProfile()">Save changes</button>
            <div id="save-status" style="font-size:13px;color:var(--text3)"></div>
          </div>
        </div>

        <!-- Trust history -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Trust Score History</div>
            <div id="trust-history-meta" style="font-size:13px;color:var(--text3)"></div>
          </div>
          <div id="trust-history-list">
            <div style="text-align:center;padding:30px">
              <div class="spinner spinner-dark" style="display:inline-block"></div>
            </div>
          </div>
          <div id="trust-history-more" style="text-align:center;padding:12px;display:none">
            <button class="btn btn-secondary btn-sm" onclick="loadMoreHistory()">Load more</button>
          </div>
        </div>

      </div>

      <!-- Error state -->
      <div id="profile-error" style="display:none"></div>

    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script src="js/app-shell.js"></script>
<script>
let profileUser   = null;
let histCursor    = null;

(async function boot() {
  const user = initShell({ title: 'Profile' });
  if (!user) return;
  await loadProfile();
})();

async function loadProfile() {
  const res = await api.get('/users/me');

  if (!res || !res.ok) {
    document.getElementById('profile-header-wrap').style.display = 'none';
    document.getElementById('profile-error').style.display = 'block';
    document.getElementById('profile-error').innerHTML = `
      <div class="error-banner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        ${res?.data?.error?.message || 'Failed to load profile.'}
      </div>`;
    return;
  }

  profileUser = res.data.data?.user || res.data.data;

  // Update localStorage so sidebar reflects latest
  localStorage.setItem('cs_user', JSON.stringify(profileUser));
  updateSidebarUser(profileUser);

  renderHeader();
  renderTrustScore();
  renderAccountInfo();
  prefillEditForm();

  document.getElementById('profile-header-wrap').style.display = 'none';
  document.getElementById('profile-content').style.display     = 'block';

  loadTrustHistory();
}

function renderHeader() {
  const u = profileUser;
  const initials = (u.username || u.email || '?').slice(0, 2).toUpperCase();
  const tier = u.trustTier || getTrustTier(u.trustScore || 0);

  document.getElementById('profile-header-wrap').innerHTML = `
    <div class="profile-header">
      <div class="profile-ava">${initials}</div>
      <div style="flex:1">
        <div class="profile-name">${u.username || '—'}</div>
        <div style="color:var(--text3);font-size:14px;margin-top:2px">${u.email || ''}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <div class="badge badge-${roleBadge(u.role)}">${u.role}</div>
          <div class="badge badge-${tierBadge(tier)}">${tier}</div>
          ${u.phone ? `<div class="badge badge-gray">${u.phone}</div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderTrustScore() {
  const score = profileUser.trustScore || 0;
  const tier  = profileUser.trustTier || getTrustTier(score);
  const color = score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--amber)' : 'var(--red)';

  const tierBadgeEl = document.getElementById('trust-tier-badge');
  tierBadgeEl.textContent  = tier;
  tierBadgeEl.className    = `badge badge-${tierBadge(tier)}`;

  const tiers = [
    { label: 'POOR',      range: '0–40',  min: 0,  max: 40  },
    { label: 'FAIR',      range: '41–60', min: 41, max: 60  },
    { label: 'GOOD',      range: '61–80', min: 61, max: 80  },
    { label: 'GREAT',     range: '81–90', min: 81, max: 90  },
    { label: 'EXCELLENT', range: '91–100',min: 91, max: 100 },
  ];
  const currentTier = tiers.find(t => score >= t.min && score <= t.max);

  document.getElementById('trust-score-section').innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px">
      <div>
        <div style="font-family:var(--ff-d);font-size:54px;font-weight:700;color:${color};line-height:1">${score}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px">out of 100</div>
      </div>
      <div style="flex:1">
        <div style="height:10px;background:var(--bg3);border-radius:100px;overflow:hidden;margin-bottom:6px">
          <div style="height:100%;width:${score}%;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));border-radius:100px;transition:.4s"></div>
        </div>
        <div style="font-size:12px;color:var(--text3)">Updated with each payment event</div>
      </div>
    </div>
    <div class="trust-tier-grid">
      ${tiers.map(t => `
        <div class="tier-chip ${t.label === (currentTier?.label || '') ? 'active' : ''}">
          <div class="tier-chip-label">${t.label}</div>
          <div class="tier-chip-range">${t.range}</div>
        </div>`).join('')}
    </div>`;
}

function renderAccountInfo() {
  const u = profileUser;
  document.getElementById('account-info-section').innerHTML = `
    <div class="info-row"><div class="info-row-label">Username</div><div class="info-row-val">${u.username || '—'}</div></div>
    <div class="info-row"><div class="info-row-label">Email</div><div class="info-row-val">${u.email || '—'}</div></div>
    <div class="info-row"><div class="info-row-label">Phone</div><div class="info-row-val">${u.phone || `<span style="color:var(--text3);font-style:italic">Not set</span>`}</div></div>
    <div class="info-row"><div class="info-row-label">Role</div><div class="info-row-val"><div class="badge badge-${roleBadge(u.role)}">${u.role}</div></div></div>
    <div class="info-row"><div class="info-row-label">Member since</div><div class="info-row-val">${fmtDate(u.createdAt)}</div></div>
    <div class="info-row"><div class="info-row-label">Account ID</div><div class="info-row-val" style="font-family:monospace;font-size:12px;color:var(--text3)">${u.id}</div></div>`;
}

function prefillEditForm() {
  const u = profileUser;
  document.getElementById('edit-username').value = u.username || '';
  document.getElementById('edit-phone').value    = u.phone    || '';
  document.getElementById('edit-avatar').value   = u.avatarUrl || '';
}

async function handleUpdateProfile() {
  const username  = document.getElementById('edit-username').value.trim();
  const phone     = document.getElementById('edit-phone').value.trim();
  const avatarUrl = document.getElementById('edit-avatar').value.trim();

  if (!username) { toast('Username cannot be empty', 'error'); return; }

  const btn    = document.getElementById('save-profile-btn');
  const status = document.getElementById('save-status');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…';
  status.textContent = '';

  const payload = { username };
  if (phone)     payload.phone     = phone;
  if (avatarUrl) payload.avatarUrl = avatarUrl;

  const res = await api.patch('/users/me', payload);

  btn.disabled = false; btn.innerHTML = 'Save changes';

  if (!res || !res.ok) {
    toast(res?.data?.error?.message || 'Failed to update profile', 'error');
    return;
  }

  const updated = res.data.data?.user || res.data.data;
  if (updated) {
    profileUser = updated;
    localStorage.setItem('cs_user', JSON.stringify(updated));
    updateSidebarUser(updated);
    renderHeader();
    renderAccountInfo();
  }

  toast('Profile updated!', 'success');
  status.textContent = 'Saved ' + new Date().toLocaleTimeString();
}

async function loadTrustHistory(append = false) {
  if (!append) {
    document.getElementById('trust-history-list').innerHTML = `
      <div style="text-align:center;padding:30px">
        <div class="spinner spinner-dark" style="display:inline-block"></div>
      </div>`;
  }

  let url = '/users/me/trust-history?limit=15';
  if (append && histCursor) url += `&cursor=${histCursor}`;

  const res = await api.get(url);

  if (!res || !res.ok) {
    document.getElementById('trust-history-list').innerHTML = `
      <div style="font-size:13px;color:var(--text3);padding:20px 0;text-align:center">
        ${res?.data?.error?.message || 'Failed to load trust history.'}
      </div>`;
    return;
  }

  const events = res.data.data || [];
  const meta   = res.data.meta?.pagination;
  histCursor   = meta?.nextCursor || null;
  document.getElementById('trust-history-more').style.display = meta?.hasMore ? 'block' : 'none';
  document.getElementById('trust-history-meta').textContent   = events.length ? `${events.length} events` : '';

  if (!events.length && !append) {
    document.getElementById('trust-history-list').innerHTML = `
      <div style="font-size:14px;color:var(--text3);padding:20px 0;text-align:center;font-style:italic">
        No trust history yet. Make on-time payments to build your score.
      </div>`;
    return;
  }

  const html = events.map(e => {
    const positive = e.delta > 0;
    const color    = positive ? 'var(--green)' : 'var(--red)';
    const bg       = positive ? 'var(--green-l)' : 'var(--red-l)';
    return `<div class="history-item">
      <div class="delta-badge" style="background:${bg};color:${color}">
        ${positive ? '+' : ''}${e.delta}
      </div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${formatEventType(e.eventType)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${fmtDate(e.createdAt)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:var(--ff-d);font-size:16px;font-weight:700;color:var(--text)">→ ${e.scoreAfter}</div>
        <div style="font-size:11px;color:var(--text3)">score after</div>
      </div>
    </div>`;
  }).join('');

  if (append) {
    document.getElementById('trust-history-list').insertAdjacentHTML('beforeend', html);
  } else {
    document.getElementById('trust-history-list').innerHTML = html;
  }
}

function formatEventType(type) {
  const map = {
    PAYMENT_ON_TIME:   '✅ On-time payment',
    PAYMENT_LATE:      '⚠️ Late payment',
    PAYMENT_DEFAULT:   '❌ Payment default',
    CIRCLE_COMPLETED:  '🎉 Circle completed',
    CIRCLE_DISSOLVED:  '⭕ Circle dissolved',
    MANUAL_ADJUSTMENT: '🔧 Manual adjustment',
  };
  return map[type] || type.replace(/_/g, ' ');
}

function loadMoreHistory() { loadTrustHistory(true); }
</script>
</body>
</html>
