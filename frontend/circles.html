<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Circles — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="app-layout">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <h1>Circle<span>Save</span></h1>
      <p>Community savings platform</p>
    </div>
    <div class="nav-section">
      <div class="nav-label">Main</div>
      <a href="dashboard.html"     class="nav-item" id="nav-dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="circles.html"       class="nav-item" id="nav-circles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>My Circles</a>
      <a href="payments.html"      class="nav-item" id="nav-payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Payments</a>
      <a href="notifications.html" class="nav-item" id="nav-notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Notifications<span id="sidebar-notif-dot" style="display:none;width:6px;height:6px;background:var(--red);border-radius:50%;margin-left:auto"></span></a>
    </div>
    <div class="nav-section">
      <div class="nav-label">Account</div>
      <a href="profile.html" class="nav-item" id="nav-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
      <a href="admin.html"   class="nav-item" id="nav-admin" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin</a>
    </div>
    <div class="sidebar-user">
      <div class="ava" id="sidebar-ava">?</div>
      <div class="info"><div class="name" id="sidebar-name">Loading…</div><div class="role" id="sidebar-role">MEMBER</div></div>
      <button class="btn-icon btn-ghost" title="Sign out" onclick="handleLogout()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <header id="topbar">
      <button class="topbar-menu" onclick="toggleSidebar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">My Circles</div>
      <a href="notifications.html" class="notif-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div class="notif-badge" id="notif-badge" style="display:none"></div></a>
      <button class="btn btn-primary btn-sm" onclick="showModal('modal-create-circle')">+ New Circle</button>
    </header>

    <div id="page" class="page-fade">
      <div class="section-header">
        <h2 class="section-title">My Circles</h2>
        <div style="display:flex;gap:10px">
          <button class="btn btn-secondary btn-sm" onclick="showModal('modal-join-circle')">Join Circle</button>
          <button class="btn btn-primary   btn-sm" onclick="showModal('modal-create-circle')">+ Create Circle</button>
        </div>
      </div>
      <div id="circles-grid" class="circles-grid">
        <div style="grid-column:1/-1;text-align:center;padding:40px"><div class="spinner spinner-dark" style="display:inline-block"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav">
  <a href="dashboard.html"     class="bnav-item" id="bnav-dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Home</a>
  <a href="circles.html"       class="bnav-item" id="bnav-circles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>Circles</a>
  <a href="payments.html"      class="bnav-item" id="bnav-payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Payments</a>
  <a href="profile.html"       class="bnav-item" id="bnav-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</div>

<!-- CREATE CIRCLE MODAL -->
<div class="modal-overlay" id="modal-create-circle">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Create a New Circle</div><button class="modal-close" onclick="closeModal('modal-create-circle')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="form-group"><label class="form-label">Circle name</label><input type="text" class="form-input" id="cc-name" placeholder="Family Savings Group"></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="cc-desc" rows="3" placeholder="What is this circle for?"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Contribution amount</label><input type="number" class="form-input" id="cc-amount" placeholder="500" min="1"></div>
      <div class="form-group"><label class="form-label">Currency</label><select class="form-select" id="cc-currency"><option>USD</option><option>EUR</option><option>KZT</option><option>GBP</option><option>RUB</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Max members</label><input type="number" class="form-input" id="cc-max" placeholder="8" min="2" max="100"></div>
      <div class="form-group"><label class="form-label">Frequency (days)</label><input type="number" class="form-input" id="cc-freq" placeholder="30" min="1" value="30"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('modal-create-circle')">Cancel</button>
      <button class="btn btn-primary"   style="flex:1" onclick="handleCreateCircle()">Create Circle</button>
    </div>
  </div>
</div>

<!-- JOIN CIRCLE MODAL -->
<div class="modal-overlay" id="modal-join-circle">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Join a Circle</div><button class="modal-close" onclick="closeModal('modal-join-circle')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div style="margin-bottom:20px;color:var(--text3);font-size:14px">Enter the invite code shared by your circle organiser.</div>
    <div class="form-group"><label class="form-label">Invite code</label><input type="text" class="form-input" id="join-code" placeholder="inv-fam-001" style="font-family:monospace;font-size:13px"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('modal-join-circle')">Cancel</button>
      <button class="btn btn-primary"   style="flex:1" onclick="handleJoinCircle()">Request to Join</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script>
(function () {
  const user = requireAuth();
  if (!user) return;
  updateSidebarUser(user);
  initNav();
  checkNotifBadge();
  loadCircles();
  initModalOverlays();
})();

async function loadCircles() {
  let circles = DEMO.circles;
  const res = await api.get('/circles');
  if (res && res.ok && res.data.data) circles = res.data.data;

  if (!circles.length) {
    document.getElementById('circles-grid').innerHTML = `
      <div style="grid-column:1/-1" class="empty-state">
        <div class="empty-icon">⭕</div>
        <div class="empty-title">No circles yet</div>
        <div class="empty-desc">Create your first circle or join one with an invite code.</div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-outline" onclick="showModal('modal-join-circle')">Join Circle</button>
          <button class="btn btn-primary" onclick="showModal('modal-create-circle')">Create Circle</button>
        </div>
      </div>`;
    return;
  }
  document.getElementById('circles-grid').innerHTML = circles.map(circleCard).join('');
}

function circleCard(c) {
  const pct = c.totalRounds ? Math.round((c.currentRound / c.totalRounds) * 100) : 0;
  return `<a href="circle-detail.html?id=${c.id}" class="circle-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div class="circle-name">${c.name}</div>
      <div class="badge badge-${statusBadge(c.status)}">${c.status}</div>
    </div>
    <div class="circle-desc">${c.description || 'No description'}</div>
    <div class="circle-meta">
      <div class="circle-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${c.currentMembers}/${c.maxMembers}</div>
      <div class="circle-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Every ${c.frequencyDays} days</div>
      ${c.nextPaymentDate ? `<div class="circle-meta-item">Next: ${fmtDate(c.nextPaymentDate)}</div>` : ''}
    </div>
    <div class="circle-amount">${c.contributionAmount.toLocaleString()} <span>${c.currency}/member</span></div>
    ${c.status === 'ACTIVE' ? `
    <div class="circle-progress">
      <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>Round ${c.currentRound} of ${c.totalRounds}</span><span>${pct}%</span></div>
    </div>` : ''}
  </a>`;
}

async function handleCreateCircle() {
  const name              = document.getElementById('cc-name').value.trim();
  const description       = document.getElementById('cc-desc').value.trim();
  const contributionAmount = parseFloat(document.getElementById('cc-amount').value);
  const currency          = document.getElementById('cc-currency').value;
  const maxMembers        = parseInt(document.getElementById('cc-max').value);
  const frequencyDays     = parseInt(document.getElementById('cc-freq').value);
  if (!name || !contributionAmount || !maxMembers || !frequencyDays) { toast('Please fill all required fields', 'error'); return; }

  const res = await api.post('/circles', { name, description, contributionAmount, currency, maxMembers, frequencyDays });
  toast(res && res.ok ? 'Circle created!' : 'Circle created (demo mode)', res && res.ok ? 'success' : 'info');
  closeModal('modal-create-circle');
  loadCircles();
}

async function handleJoinCircle() {
  const inviteCode = document.getElementById('join-code').value.trim();
  if (!inviteCode) { toast('Please enter an invite code', 'error'); return; }
  const res = await api.post('/circles/join', { inviteCode });
  toast(res && res.ok ? 'Join request submitted!' : 'Join request submitted (demo mode)', 'info');
  closeModal('modal-join-circle');
}
</script>
</body>
</html>
