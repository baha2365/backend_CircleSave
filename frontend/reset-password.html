<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html">Circle<span>Save</span></a></div>
    <div class="auth-sub">Choose a new password</div>

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input type="email" class="form-input" id="reset-email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Reset code</label>
      <input type="text" class="form-input" id="reset-code" placeholder="123456" maxlength="6"
        style="letter-spacing:4px;font-size:20px;text-align:center">
    </div>
    <div class="form-group">
      <label class="form-label">New password</label>
      <input type="password" class="form-input" id="reset-password" placeholder="8+ chars, upper, lower & number">
      <div class="form-hint">Must be 8+ characters with uppercase, lowercase, and a digit</div>
    </div>

    <button class="btn btn-primary btn-block btn-lg" onclick="handleReset()">Reset password</button>

    <div style="text-align:center;margin-top:16px">
      <a href="login.html" style="color:var(--accent);font-size:13px;font-weight:500">← Back to sign in</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script>
  const saved = sessionStorage.getItem('reset_email');
  if (saved) document.getElementById('reset-email').value = saved;

  async function handleReset() {
    const email       = document.getElementById('reset-email').value.trim();
    const code        = document.getElementById('reset-code').value.trim();
    const newPassword = document.getElementById('reset-password').value;
    if (!email || !code || !newPassword) { toast('Please fill all fields', 'error'); return; }

    const res = await api.req('POST', '/auth/reset-password', { email, code, newPassword }, false);
    toast('Password reset! Sign in with your new password.', 'success');
    sessionStorage.removeItem('reset_email');
    setTimeout(() => window.location.href = 'login.html', 800);
  }
</script>
</body>
</html>
