<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── Notification list items ─────────────────────────────────────── */
  .notif-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r12);
    margin-bottom: 10px;
    transition: .15s;
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  .notif-item.unread {
    border-left: 3px solid var(--accent);
    background: var(--surface2);
  }
  .notif-item:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
  }
  .notif-item:active { transform: translateY(0); }

  .notif-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .notif-title  { font-size: 14px; font-weight: 600; color: var(--text);  margin-bottom: 4px; }
  .notif-body   { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .notif-time   { font-size: 11px; color: var(--text3); margin-top: 6px; }

  .unread-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    top: 16px;
    right: 16px;
    flex-shrink: 0;
  }

  /* ── Filter tabs ─────────────────────────────────────────────────── */
  .filter-tab-bar {
    display: flex;
    gap: 2px;
    background: var(--bg2);
    border-radius: var(--r12);
    padding: 4px;
    margin-bottom: 20px;
    width: fit-content;
  }
  .filter-tab {
    padding: 7px 18px;
    border-radius: var(--r8);
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    transition: .15s;
  }
  .filter-tab.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: var(--sh1);
  }

  /* ── Error banner ────────────────────────────────────────────────── */
  .error-banner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--red-l);
    border: 1px solid #f5c2c2;
    border-radius: var(--r12);
    color: var(--red);
    font-size: 14px;
    font-weight: 500;
  }

  /* ── Detail drawer (slide-in from right) ─────────────────────────── */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .drawer-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: min(420px, 100vw);
    background: var(--surface, #fff);
    box-shadow: -8px 0 40px rgba(0,0,0,.12);
    z-index: 301;
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .drawer-header-left { display: flex; align-items: center; gap: 12px; }
  .drawer-header-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .drawer-title  { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .drawer-meta   { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .drawer-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    flex-shrink: 0;
    transition: background .15s;
  }
  .drawer-close:hover { background: var(--bg3); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .drawer-body-section {
    background: var(--bg2, #f6f6f6);
    border-radius: var(--r12);
    padding: 16px;
    margin-bottom: 14px;
  }
  .drawer-body-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text3);
    margin-bottom: 8px;
  }
  .drawer-body-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.65;
  }

  .drawer-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .drawer-meta-item {
    background: var(--bg2, #f6f6f6);
    border-radius: var(--r8);
    padding: 12px;
  }
  .drawer-meta-item-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .drawer-meta-item-val   { font-size: 13px; font-weight: 600; color: var(--text); }

  .drawer-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* type badge */
  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    background: var(--accent-l, #eef2ff);
    color: var(--accent, #5865f2);
  }

  /* ── "Read" indicator in list ────────────────────────────────────── */
  .read-check {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 13px;
    color: var(--text3);
  }
</style>
</head>
<body>

<div id="app-layout">
  <div id="main">
    <div id="page" class="page-fade">

      <div class="section-header" style="margin-bottom:20px">
        <h2 class="section-title">Notifications</h2>
        <button class="btn btn-secondary btn-sm" id="mark-all-btn" onclick="markAllRead()">Mark all read</button>
      </div>

      <div class="filter-tab-bar">
        <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
        <button class="filter-tab"        onclick="setFilter('unread',this)">Unread</button>
      </div>

      <div id="notifications-list">
        <div style="text-align:center;padding:60px">
          <div class="spinner spinner-dark" style="display:inline-block"></div>
          <div style="margin-top:12px;color:var(--text3);font-size:14px">Loading notifications…</div>
        </div>
      </div>

      <div id="load-more-wrap" style="text-align:center;padding:16px;display:none">
        <button class="btn btn-secondary" onclick="loadMore()">Load more</button>
      </div>

    </div>
  </div>
</div>

<!-- ── Detail drawer ──────────────────────────────────────────────── -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="notif-drawer" role="dialog" aria-modal="true" aria-label="Notification detail">

  <div class="drawer-header">
    <div class="drawer-header-left">
      <div class="drawer-header-icon" id="drawer-icon"></div>
      <div>
        <div class="drawer-title"  id="drawer-title">Notification</div>
        <div class="drawer-meta"   id="drawer-meta-time"></div>
      </div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()" title="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="drawer-body">
    <!-- Type badge -->
    <div style="margin-bottom:16px">
      <span class="type-badge" id="drawer-type-badge"></span>
    </div>

    <!-- Body text -->
    <div class="drawer-body-section">
      <div class="drawer-body-label">Message</div>
      <div class="drawer-body-text" id="drawer-body-text">—</div>
    </div>

    <!-- Metadata key-values (rendered dynamically) -->
    <div id="drawer-metadata-wrap"></div>
  </div>

  <div class="drawer-footer">
    <button class="btn btn-secondary" style="width:100%" onclick="closeDrawer()">Close</button>
  </div>

</div>

<script src="js/shared.js"></script>
<script src="js/app-shell.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
let nextCursor = null;
let unreadOnly = false;
// Store fetched notifications so we can look them up on click
let cachedNotifications = [];

// ── Boot ───────────────────────────────────────────────────────────────────
(async function boot() {
  const user = initShell({ title: 'Notifications' });
  if (!user) return;
  await loadNotifications();
})();

// ── Filter toggle ──────────────────────────────────────────────────────────
function setFilter(filter, btn) {
  unreadOnly = filter === 'unread';
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  nextCursor = null;
  cachedNotifications = [];
  loadNotifications();
}

// ── Load notifications ─────────────────────────────────────────────────────
async function loadNotifications(append = false) {
  if (!append) {
    document.getElementById('notifications-list').innerHTML = `
      <div style="text-align:center;padding:60px">
        <div class="spinner spinner-dark" style="display:inline-block"></div>
        <div style="margin-top:12px;color:var(--text3);font-size:14px">Loading…</div>
      </div>`;
  }

  let url = '/users/me/notifications?limit=20';
  if (unreadOnly) url += '&unreadOnly=true';
  if (append && nextCursor) url += `&cursor=${nextCursor}`;

  const res = await api.get(url);

  if (!res || !res.ok) {
    document.getElementById('notifications-list').innerHTML = `
      <div class="error-banner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        ${res?.data?.error?.message || 'Failed to load notifications.'}
      </div>`;
    return;
  }

  // API returns the array directly in res.data.data
  const notifications = res.data.data || [];
  const meta          = res.data.meta?.pagination;
  nextCursor          = meta?.nextCursor || null;
  document.getElementById('load-more-wrap').style.display = meta?.hasMore ? 'block' : 'none';

  // Cache for drawer lookup
  if (append) {
    cachedNotifications = cachedNotifications.concat(notifications);
  } else {
    cachedNotifications = notifications;
  }

  if (!notifications.length && !append) {
    document.getElementById('notifications-list').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text3)">
        <div style="font-size:40px;margin-bottom:12px">🔔</div>
        <div style="font-family:var(--ff-d);font-size:20px;font-weight:600;color:var(--text2);margin-bottom:8px">
          ${unreadOnly ? 'All caught up!' : 'No notifications yet'}
        </div>
        <div style="font-size:14px">
          ${unreadOnly ? 'You have no unread notifications.' : 'Notifications will appear here as activity happens.'}
        </div>
      </div>`;
    updateBadge(false);
    return;
  }

  const html = notifications.map(n => notifItem(n)).join('');
  if (append) {
    document.getElementById('notifications-list').insertAdjacentHTML('beforeend', html);
  } else {
    document.getElementById('notifications-list').innerHTML = html;
  }

  // ── FIX: use isRead (API field), not read ──────────────────────────
  const hasUnread = notifications.some(n => !n.isRead);
  updateBadge(hasUnread);
}

// ── Render a single notification row ──────────────────────────────────────
function notifItem(n) {
  // ── FIX: API returns title/body at top level, NOT inside n.data ────
  const title   = n.title || 'Notification';
  const body    = n.body  || '';
  // ── FIX: API field is isRead, not read ─────────────────────────────
  const isUnread = !n.isRead;
  const icon    = notifIcon(n.type || title);

  return `<div
    class="notif-item ${isUnread ? 'unread' : ''}"
    id="notif-${n.id}"
    onclick="openDrawer('${n.id}')"
    title="Click to read"
  >
    <div class="notif-icon" style="background:${isUnread ? 'var(--accent-l)' : 'var(--bg3)'}">
      ${icon}
    </div>
    <div style="flex:1;min-width:0">
      <div class="notif-title">${escHtml(title)}</div>
      <div class="notif-body" style="
        overflow:hidden;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
      ">${escHtml(body)}</div>
      <div class="notif-time">${timeAgo(n.createdAt)}</div>
    </div>
    ${isUnread
      ? '<div class="unread-dot"></div>'
      : '<div class="read-check" title="Read">✓</div>'}
  </div>`;
}

// ── Choose icon by notification type (API type field) or title text ────────
function notifIcon(typeOrTitle) {
  const s = (typeOrTitle || '').toUpperCase();
  if (s.includes('PAYMENT') || s.includes('CONTRIBUTION')) return '💳';
  if (s.includes('PAYOUT'))     return '💰';
  if (s.includes('MEMBER'))     return '👤';
  if (s.includes('ACTIVATED') || s.includes('ACTIVATE')) return '⚡';
  if (s.includes('SWAP'))       return '🔄';
  if (s.includes('LATE') || s.includes('FEE')) return '⚠️';
  if (s.includes('CIRCLE'))     return '⭕';
  if (s.includes('DEFAULT'))    return '🚨';
  if (s.includes('JOIN'))       return '🙋';
  if (s.includes('APPROVED'))   return '✅';
  if (s.includes('REJECTED'))   return '❌';
  return '🔔';
}

// ── Nice label for notification type ──────────────────────────────────────
function typeLabel(type) {
  if (!type) return 'Notification';
  return type.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

// ── Open detail drawer ─────────────────────────────────────────────────────
function openDrawer(id) {
  const n = cachedNotifications.find(x => x.id === id);
  if (!n) return;

  // ── FIX: use top-level fields ──────────────────────────────────────
  const title  = n.title || 'Notification';
  const body   = n.body  || '(no content)';
  const isUnread = !n.isRead;
  const icon   = notifIcon(n.type || title);

  // Header
  const iconEl = document.getElementById('drawer-icon');
  iconEl.textContent = icon;
  iconEl.style.background = isUnread ? 'var(--accent-l)' : 'var(--bg3)';

  document.getElementById('drawer-title').textContent    = title;
  document.getElementById('drawer-meta-time').textContent = timeAgo(n.createdAt) + (isUnread ? ' · Unread' : ' · Read');

  // Type badge
  const badge = document.getElementById('drawer-type-badge');
  badge.textContent = typeLabel(n.type);

  // Body
  document.getElementById('drawer-body-text').textContent = body;

  // Metadata key-values (if any)
  const metaWrap = document.getElementById('drawer-metadata-wrap');
  const meta = n.metadata;
  if (meta && typeof meta === 'object' && Object.keys(meta).length > 0) {
    const items = Object.entries(meta)
      .filter(([, v]) => v !== null && v !== undefined)
      .map(([k, v]) => {
        const label = k.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
        const val   = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `<div class="drawer-meta-item">
          <div class="drawer-meta-item-label">${escHtml(label)}</div>
          <div class="drawer-meta-item-val">${escHtml(val)}</div>
        </div>`;
      }).join('');

    metaWrap.innerHTML = `
      <div style="margin-bottom:8px">
        <div class="drawer-body-label">Details</div>
      </div>
      <div class="drawer-meta-grid">${items}</div>`;
  } else {
    metaWrap.innerHTML = '';
  }

  // Open
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('notif-drawer').classList.add('open');

  // Mark as read in UI immediately
  if (isUnread) {
    markItemReadInUI(id);
  }
}

// ── Close detail drawer ────────────────────────────────────────────────────
function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('notif-drawer').classList.remove('open');
}

// ESC key closes drawer
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
});

// ── Mark a single item as read in the UI (no extra API call needed) ────────
function markItemReadInUI(id) {
  // Update cache
  const n = cachedNotifications.find(x => x.id === id);
  if (n) n.isRead = true;

  // Update DOM
  const el = document.getElementById('notif-${id}');
  // Use querySelector with the actual id since template literal above is in a function
  const itemEl = document.getElementById(`notif-${id}`);
  if (itemEl) {
    itemEl.classList.remove('unread');
    const dot = itemEl.querySelector('.unread-dot');
    if (dot) {
      dot.classList.remove('unread-dot');
      dot.classList.add('read-check');
      dot.textContent = '✓';
      dot.title = 'Read';
    }
    const iconEl = itemEl.querySelector('.notif-icon');
    if (iconEl) iconEl.style.background = 'var(--bg3)';
  }

  // Update badge
  const stillUnread = cachedNotifications.some(x => !x.isRead);
  updateBadge(stillUnread);
}

// ── Mark all read (button) ─────────────────────────────────────────────────
async function markAllRead() {
  const btn = document.getElementById('mark-all-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner spinner-dark"></span>';

  const res = await api.patch('/users/me/notifications/read-all');
  btn.disabled = false;
  btn.innerHTML = 'Mark all read';

  if (!res || !res.ok) {
    toast(res?.data?.error?.message || 'Failed to mark notifications as read', 'error');
    return;
  }

  toast('All notifications marked as read', 'success');
  updateBadge(false);

  // Update cache
  cachedNotifications.forEach(n => n.isRead = true);

  // Update DOM
  document.querySelectorAll('.notif-item.unread').forEach(el => {
    el.classList.remove('unread');
    const dot = el.querySelector('.unread-dot');
    if (dot) {
      dot.classList.remove('unread-dot');
      dot.classList.add('read-check');
      dot.textContent = '✓';
    }
    const iconEl = el.querySelector('.notif-icon');
    if (iconEl) iconEl.style.background = 'var(--bg3)';
  });
}

// ── Load more ──────────────────────────────────────────────────────────────
function loadMore() { loadNotifications(true); }

// ── Badge helper ───────────────────────────────────────────────────────────
function updateBadge(hasUnread) {
  const badge = document.getElementById('notif-badge');
  const dot   = document.getElementById('sidebar-notif-dot');
  if (badge) badge.style.display = hasUnread ? 'block' : 'none';
  if (dot)   dot.style.display   = hasUnread ? 'block' : 'none';
}

// ── Time formatting ────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return '—';
  const diff  = Date.now() - new Date(dateStr).getTime();
  const mins  = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days  = Math.floor(diff / 86400000);
  if (mins  < 1)  return 'Just now';
  if (mins  < 60) return `${mins}m ago`;
  if (hours < 24) return `${hours}h ago`;
  if (days  < 7)  return `${days}d ago`;
  return fmtDate(dateStr);
}

// ── HTML escape helper (prevent XSS from notification content) ─────────────
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
</body>
</html>
