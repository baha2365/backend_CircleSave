<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .notif-item{
    display:flex;align-items:flex-start;gap:14px;padding:16px 18px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);
    margin-bottom:10px;transition:.15s;position:relative;
  }
  .notif-item.unread{border-left:3px solid var(--accent);background:var(--surface2)}
  .notif-item:hover{border-color:var(--border2)}
  .notif-icon{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:18px;flex-shrink:0;
  }
  .notif-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
  .notif-body{font-size:13px;color:var(--text2);line-height:1.5}
  .notif-time{font-size:11px;color:var(--text3);margin-top:6px}
  .unread-dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    position:absolute;top:16px;right:16px;flex-shrink:0;
  }
  .filter-tab-bar{display:flex;gap:2px;background:var(--bg2);border-radius:var(--r12);padding:4px;margin-bottom:20px;width:fit-content}
  .filter-tab{padding:7px 18px;border-radius:var(--r8);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:none;transition:.15s}
  .filter-tab.active{background:var(--surface);color:var(--accent);box-shadow:var(--sh1)}
  .error-banner{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--red-l);border:1px solid #f5c2c2;border-radius:var(--r12);color:var(--red);font-size:14px;font-weight:500}
</style>
</head>
<body>

<div id="app-layout">
  <div id="main">
    <div id="page" class="page-fade">

      <div class="section-header" style="margin-bottom:20px">
        <h2 class="section-title">Notifications</h2>
        <button class="btn btn-secondary btn-sm" id="mark-all-btn" onclick="markAllRead()">Mark all read</button>
      </div>

      <div class="filter-tab-bar">
        <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
        <button class="filter-tab"        onclick="setFilter('unread',this)">Unread</button>
      </div>

      <div id="notifications-list">
        <div style="text-align:center;padding:60px">
          <div class="spinner spinner-dark" style="display:inline-block"></div>
          <div style="margin-top:12px;color:var(--text3);font-size:14px">Loading notifications…</div>
        </div>
      </div>

      <div id="load-more-wrap" style="text-align:center;padding:16px;display:none">
        <button class="btn btn-secondary" onclick="loadMore()">Load more</button>
      </div>

    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script src="js/app-shell.js"></script>
<script>
let nextCursor  = null;
let unreadOnly  = false;

(async function boot() {
  const user = initShell({ title: 'Notifications' });
  if (!user) return;
  await loadNotifications();
})();

function setFilter(filter, btn) {
  unreadOnly = filter === 'unread';
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  nextCursor = null;
  loadNotifications();
}

async function loadNotifications(append = false) {
  if (!append) {
    document.getElementById('notifications-list').innerHTML = `
      <div style="text-align:center;padding:60px">
        <div class="spinner spinner-dark" style="display:inline-block"></div>
        <div style="margin-top:12px;color:var(--text3);font-size:14px">Loading…</div>
      </div>`;
  }

  let url = '/users/me/notifications?limit=20';
  if (unreadOnly) url += '&unreadOnly=true';
  if (append && nextCursor) url += `&cursor=${nextCursor}`;

  const res = await api.get(url);

  if (!res || !res.ok) {
    document.getElementById('notifications-list').innerHTML = `
      <div class="error-banner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        ${res?.data?.error?.message || 'Failed to load notifications.'}
      </div>`;
    return;
  }

  const notifications = res.data.data || [];
  const meta = res.data.meta?.pagination;
  nextCursor = meta?.nextCursor || null;
  document.getElementById('load-more-wrap').style.display = meta?.hasMore ? 'block' : 'none';

  if (!notifications.length && !append) {
    document.getElementById('notifications-list').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text3)">
        <div style="font-size:40px;margin-bottom:12px">🔔</div>
        <div style="font-family:var(--ff-d);font-size:20px;font-weight:600;color:var(--text2);margin-bottom:8px">
          ${unreadOnly ? 'All caught up!' : 'No notifications yet'}
        </div>
        <div style="font-size:14px">${unreadOnly ? 'You have no unread notifications.' : 'Notifications will appear here as activity happens.'}</div>
      </div>`;

    // Update badge to zero
    const badge = document.getElementById('notif-badge');
    const dot   = document.getElementById('sidebar-notif-dot');
    if (badge) badge.style.display = 'none';
    if (dot)   dot.style.display   = 'none';
    return;
  }

  const html = notifications.map(n => notifItem(n)).join('');
  if (append) {
    document.getElementById('notifications-list').insertAdjacentHTML('beforeend', html);
  } else {
    document.getElementById('notifications-list').innerHTML = html;
  }

  // Show badge if unread exist
  const hasUnread = notifications.some(n => !n.read);
  const badge = document.getElementById('notif-badge');
  const dot   = document.getElementById('sidebar-notif-dot');
  if (badge) badge.style.display = hasUnread ? 'block' : 'none';
  if (dot)   dot.style.display   = hasUnread ? 'block' : 'none';
}

function notifItem(n) {
  const title = n.data?.title || 'Notification';
  const body  = n.data?.body  || '';
  const icon  = notifIcon(title);

  return `<div class="notif-item ${n.read ? '' : 'unread'}" id="notif-${n.id}">
    <div class="notif-icon" style="background:${n.read ? 'var(--bg3)' : 'var(--accent-l)'}">
      ${icon}
    </div>
    <div style="flex:1;min-width:0">
      <div class="notif-title">${title}</div>
      <div class="notif-body">${body}</div>
      <div class="notif-time">${timeAgo(n.createdAt)}</div>
    </div>
    ${!n.read ? '<div class="unread-dot"></div>' : ''}
  </div>`;
}

function notifIcon(title) {
  const t = (title || '').toLowerCase();
  if (t.includes('payment') || t.includes('contribution')) return '💳';
  if (t.includes('payout'))   return '💰';
  if (t.includes('member'))   return '👤';
  if (t.includes('activated') || t.includes('activate')) return '⚡';
  if (t.includes('swap'))     return '🔄';
  if (t.includes('late') || t.includes('fee')) return '⚠️';
  if (t.includes('circle'))   return '⭕';
  return '🔔';
}

function timeAgo(dateStr) {
  if (!dateStr) return '—';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins  = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days  = Math.floor(diff / 86400000);
  if (mins < 1)   return 'Just now';
  if (mins < 60)  return `${mins}m ago`;
  if (hours < 24) return `${hours}h ago`;
  if (days < 7)   return `${days}d ago`;
  return fmtDate(dateStr);
}

async function markAllRead() {
  const btn = document.getElementById('mark-all-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner spinner-dark"></span>';
  const res = await api.patch('/users/me/notifications/read-all');
  btn.disabled = false; btn.innerHTML = 'Mark all read';

  if (!res || !res.ok) {
    toast(res?.data?.error?.message || 'Failed to mark notifications as read', 'error');
    return;
  }

  toast('All notifications marked as read', 'success');
  const badge = document.getElementById('notif-badge');
  const dot   = document.getElementById('sidebar-notif-dot');
  if (badge) badge.style.display = 'none';
  if (dot)   dot.style.display   = 'none';

  // Update UI without refetch
  document.querySelectorAll('.notif-item.unread').forEach(el => {
    el.classList.remove('unread');
    const dot = el.querySelector('.unread-dot');
    if (dot) dot.remove();
  });
}

function loadMore() { loadNotifications(true); }
</script>
</body>
</html>
