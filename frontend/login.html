<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — CircleSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html">Circle<span>Save</span></a></div>
    <div class="auth-sub">Welcome back</div>

    <div style="display:flex;background:var(--bg2);border-radius:var(--r12);padding:4px;margin-bottom:28px">
      <a href="login.html"    class="auth-tab active" style="flex:1;text-align:center;padding:8px;border-radius:var(--r8);font-size:14px;font-weight:500;background:var(--surface);color:var(--text);box-shadow:var(--sh1)">Sign in</a>
      <a href="register.html" class="auth-tab"        style="flex:1;text-align:center;padding:8px;border-radius:var(--r8);font-size:14px;font-weight:500;color:var(--text2)">Create account</a>
    </div>

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input type="email" class="form-input" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="login-password" placeholder="Your password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') handleLogin()">
    </div>
    <div style="text-align:right;margin-bottom:20px">
      <a href="forgot-password.html" style="font-size:13px;color:var(--accent);font-weight:500">Forgot password?</a>
    </div>

    <button class="btn btn-primary btn-block btn-lg" id="login-btn" onclick="handleLogin()">Sign in</button>

    <div style="text-align:center;margin-top:20px;font-size:14px;color:var(--text3)">
      Don't have an account? <a href="register.html" style="color:var(--accent);font-weight:500">Sign up</a>
    </div>

    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
      <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:12px">Demo credentials</div>
      <div style="background:var(--bg2);border-radius:var(--r8);padding:12px;font-size:13px;color:var(--text2)">
        <div>Email: <strong>alice@example.com</strong></div>
        <div>Password: <strong>Secure123</strong></div>
      </div>
      <button class="btn btn-secondary btn-block btn-sm" style="margin-top:10px" onclick="fillDemo()">Use demo account</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script>
  // Redirect if already logged in
  if (localStorage.getItem('cs_access_token') && localStorage.getItem('cs_user')) {
    window.location.href = 'dashboard.html';
  }

  function fillDemo() {
    document.getElementById('login-email').value    = 'alice@example.com';
    document.getElementById('login-password').value = 'Secure123';
  }

  async function handleLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { toast('Please fill all fields', 'error'); return; }

    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    btn.disabled = true;

    const res = await api.req('POST', '/auth/login', { email, password }, false);

    btn.innerHTML = 'Sign in';
    btn.disabled = false;

    if (res && res.ok && res.data.success) {
      const { accessToken: at, refreshToken: rt, user } = res.data.data;
      saveTokens(at, rt, user);
      toast(`Welcome back, ${user.username}!`, 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 600);
    } else if (email === 'alice@example.com' && password === 'Secure123') {
      demoLogin();
    } else if (res && res.status === 0) {
      // API unreachable — allow demo
      toast('API unavailable. Use demo credentials to continue.', 'info');
    } else {
      toast(res?.data?.error?.message || 'Invalid email or password', 'error');
    }
  }

  function demoLogin() {
    saveTokens('demo-token', 'demo-refresh', DEMO.user);
    toast('Signed in with demo account', 'info');
    setTimeout(() => window.location.href = 'dashboard.html', 600);
  }
</script>
</body>
</html>
